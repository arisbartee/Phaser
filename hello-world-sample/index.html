<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <meta name="description" content="An interactive, visually stunning Hello World web experience with particle burst animations and modern CSS.">
    <meta name="author" content="Phaser AI">
    <meta name="keywords" content="Hello World, HTML, CSS, JavaScript, interactive, animation, canvas">
    <meta property="og:title" content="Hello World - Interactive Web Experience">
    <meta property="og:description" content="Experience a beautiful, modern Hello World with particle animations.">
    <meta property="og:type" content="website">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            color: var(--text-color);
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 4rem 6rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -2px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradient-pulse 8s ease infinite;
        }

        p {
            margin-top: 1rem;
            font-size: 1.25rem;
            opacity: 0.8;
            font-weight: 400;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @keyframes gradient-pulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient background glow */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary-gradient);
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            z-index: 1;
            animation: pulse-glow 10s alternate infinite;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.5); opacity: 0.35; }
        }

        /* Responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 3rem 2rem;
            }
            h1 {
                font-size: 3.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 2.5rem 1.5rem;
            }
            h1 {
                font-size: 2.5rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <h1 id="main-heading">Hello World</h1>
        <p>Interactive web experience</p>
    </div>
    
    <canvas id="particleCanvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100;"></canvas>
    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const heading = document.getElementById('main-heading');
        
        document.body.style.cursor = 'pointer';
        heading.style.transition = 'transform 0.15s cubic-bezier(0.4, 0, 0.2, 1)';
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let particles = [];
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 5 + 2;
                const colors = ['#6366f1', '#a855f7', '#ec4899', '#38bdf8', '#818cf8'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.vx *= 0.95;
                this.vy *= 0.95;
            }
            
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.fill();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.closePath();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
            requestAnimationFrame(animate);
        }

        animate();

        document.addEventListener('click', (e) => {
            const burstCount = 60;
            for (let i = 0; i < burstCount; i++) {
                particles.push(new Particle(e.clientX, e.clientY));
            }
            
            heading.style.transform = 'scale(0.9)';
            setTimeout(() => {
                heading.style.transform = 'scale(1)';
            }, 150);
        });
    </script>
</body>
</html>
